server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A utiliser uniquement pour un lancement local du conteneur frontend
    # seul (docker run), en remplacement du default.conf embarque dans
    # l'image qui cible le domaine de production (api.transitea.fr).
    # host.docker.internal est resolu automatiquement par Docker Desktop
    # (Windows/Mac) vers la machine hote, sur laquelle tourne le backend
    # local (port 8080 publie).
    location /api/ {
        proxy_pass http://host.docker.internal:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route non-fichier retombe sur index.html pour React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
