server {
    # En mode --network host (utilise par lancement_local.sh), le conteneur
    # partage directement la pile reseau de la machine/VM hote : nginx doit
    # donc ecouter directement sur le port que l'on veut exposer, il n'y a
    # plus de remappage de port via "docker run -p".
    #
    # Port 4173 (et non 8081) choisi volontairement : c'est le port de
    # "vite preview", deja present dans la liste des origines autorisees en
    # dur cote backend (ConfigurationSecurite.corsConfigurationSource()).
    # Un autre port donnerait un 403 (CORS) au login malgre une connectivite
    # reseau fonctionnelle, faute d'etre dans cette liste.
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A utiliser uniquement pour un lancement local du conteneur frontend
    # seul, en remplacement du default.conf embarque dans l'image qui cible
    # le domaine de production (api.transitea.fr).
    #
    # 127.0.0.1:8080 fonctionne ici car le conteneur frontend tourne en
    # --network host : le backend (aussi en --network host) est alors
    # directement joignable sur le port de l'hote, exactement comme s'il
    # tournait nativement (pas de pont/NAT Docker implique).
    #
    # Choix fait suite a un bug de connectivite conteneur-a-conteneur
    # observe sur un reseau Docker "bridge" defini par l'utilisateur dans
    # cet environnement (Docker natif sous WSL2) : les connexions nginx
    # vers un autre conteneur du meme reseau bridge timeout (110: Operation
    # timed out) alors qu'un wget direct dans le meme conteneur fonctionne
    # instantanement - cause non elucidee, --network host contourne le
    # probleme en supprimant le pont Docker de l'equation.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route non-fichier retombe sur index.html pour React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
