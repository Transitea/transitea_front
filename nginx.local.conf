server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A utiliser uniquement pour un lancement local du conteneur frontend
    # seul (docker run), en remplacement du default.conf embarque dans
    # l'image qui cible le domaine de production (api.transitea.fr).
    # "transitea-back" est le nom du conteneur backend : resolu par le DNS
    # interne de Docker uniquement si les deux conteneurs sont sur le meme
    # reseau Docker defini par l'utilisateur (voir --network transitea-net
    # dans les commandes docker run, LANCEMENT_LOCAL.txt).
    # host.docker.internal n'est PAS utilise ici : il ne fonctionne que sur
    # Docker Desktop (Windows/Mac) et pas sur un Docker natif (ex. WSL2 sans
    # Docker Desktop), d'ou le choix d'un reseau Docker explicite.
    location /api/ {
        proxy_pass http://transitea-back:8080/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route non-fichier retombe sur index.html pour React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
