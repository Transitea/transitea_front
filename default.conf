server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API : proxy vers le backend Spring Boot (deploye separement sur Dokploy,
    # domaine api.transitea.fr configure en HTTP simple, sans TLS - cf. Cert: none
    # dans l'onglet Domains de Dokploy).
    # /api/v1/... -> http://api.transitea.fr/v1/... (prefixe /api retire).
    # Note : avec un proxy_pass base sur une variable (necessaire ici pour que
    # $resolver refasse la resolution DNS a chaque requete), nginx desactive
    # son remplacement automatique du prefixe de location - d'ou le rewrite
    # explicite ci-dessous pour ne pas laisser passer /api/v1/... tel quel
    # (ce qui ne matche aucune route publique cote backend et se fait rejeter
    # par le filtre JWT comme si le token etait manquant).
    # Important : "set" doit venir AVANT "rewrite ... break" - break stoppe le
    # traitement du module rewrite (dont set fait partie) pour ce qui suit dans
    # le bloc, donc un "set" place apres ne s'execute jamais (variable non
    # initialisee, "invalid URL prefix" au niveau de proxy_pass).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream "http://api.transitea.fr";
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $backend_upstream;

        proxy_set_header Host api.transitea.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route non-fichier (ex. /login, /colis/nouveau) retombe sur
    # index.html pour que React Router prenne le relais cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
