server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API : proxy vers le backend Spring Boot (deploye separement sur Dokploy,
    # domaine api.transitea.fr configure en HTTP simple, sans TLS - cf. Cert:
    # none dans l'onglet Domains de Dokploy).
    # /api/v1/... -> http://api.transitea.fr/v1/... : le prefixe /api est
    # retire automatiquement par nginx car location et proxy_pass se
    # terminent tous les deux par /, comme en dev avec le proxy Vite.
    location /api/ {
        proxy_pass http://api.transitea.fr/;

        proxy_set_header Host api.transitea.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route non-fichier (ex. /login, /colis/nouveau) retombe sur
    # index.html pour que React Router prenne le relais cote client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
